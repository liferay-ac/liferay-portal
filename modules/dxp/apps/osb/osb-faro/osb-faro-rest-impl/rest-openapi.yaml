components:
    schemas:
        AssetSummaryMetric:
            description:
                "An aggregated set of analytics metrics for a single tracked asset (page, blog, document, form, journal,
                object entry, etc.) over the selected date range. Counts and trends are flattened from the underlying
                metric tree for LLM-friendly consumption — `*TrendPercentage` fields express change vs. the previous
                comparable period."
            properties:
                assetId:
                    description:
                        "Identifier of the tracked asset."
                    readOnly: true
                    type: string
                assetTitle:
                    description:
                        "Display title of the asset, e.g. the page title or blog post title."
                    readOnly: true
                    type: string
                assetType:
                    description:
                        "Asset category, e.g. 'BLOG', 'DOCUMENT', 'FORM', 'JOURNAL', 'OBJECT_ENTRY', 'PAGE'."
                    readOnly: true
                    type: string
                downloads:
                    description:
                        "Download count over the selected date range. Null when the asset type doesn't track downloads."
                    format: double
                    readOnly: true
                    type: number
                downloadsTrendPercentage:
                    description:
                        "Percentage change in downloads vs. the previous comparable period. Negative = decrease."
                    format: double
                    readOnly: true
                    type: number
                impressions:
                    description:
                        "Impression count (asset rendered into a viewport but not necessarily interacted with)."
                    format: double
                    readOnly: true
                    type: number
                impressionsTrendPercentage:
                    description:
                        "Percentage change in impressions vs. the previous comparable period."
                    format: double
                    readOnly: true
                    type: number
                reads:
                    description:
                        "Read count (full-content engagement, distinct from impressions)."
                    format: double
                    readOnly: true
                    type: number
                readsTrendPercentage:
                    description:
                        "Percentage change in reads vs. the previous comparable period."
                    format: double
                    readOnly: true
                    type: number
                views:
                    description:
                        "View count (asset opened/loaded by an individual)."
                    format: double
                    readOnly: true
                    type: number
                viewsTrendPercentage:
                    description:
                        "Percentage change in views vs. the previous comparable period."
                    format: double
                    readOnly: true
                    type: number
            type: object
        Event:
            description:
                "A single tracked analytics event captured — page views, custom events, form submissions, etc. Each
                event carries free-form `attributes` (a name-value map of contextual properties) plus any matching page
                metadata."
            properties:
                applicationId:
                    description:
                        "Identifier of the application that emitted the event (e.g. the Cerebro analytics app)."
                    readOnly: true
                    type: string
                assetTitle:
                    description:
                        "Title of the asset associated with the event, when applicable."
                    readOnly: true
                    type: string
                attributes:
                    additionalProperties:
                        type: string
                    description:
                        "Free-form event properties as a name→value map. Keys are property names defined in
                        EventAttributeDefinition; values are stringified per their underlying data type. (Mapped from
                        the engine's repeated `properties: [{name, value}]` shape.)"
                    readOnly: true
                    type: object
                canonicalUrl:
                    description:
                        "Canonical URL of the page where the event was emitted, normalized for analytics joining."
                    readOnly: true
                    type: string
                createDate:
                    description:
                        "Timestamp when the event was recorded by the engine."
                    format: date-time
                    readOnly: true
                    type: string
                emailAddressHashed:
                    description:
                        "SHA-256 hash of the originating individual's email address, when known. Used for joining
                        without leaking PII. Null for anonymous individuals."
                    readOnly: true
                    type: string
                name:
                    description:
                        "Event name as defined in EventDefinition (e.g. 'pageViewed', 'formSubmitted', etc.)."
                    readOnly: true
                    type: string
                pageDescription:
                    description:
                        "Meta description of the page that emitted the event, when present."
                    readOnly: true
                    type: string
                pageKeywords:
                    description:
                        "Meta keywords of the page that emitted the event, comma-separated when multiple."
                    readOnly: true
                    type: string
                pageTitle:
                    description:
                        "Title of the page that emitted the event."
                    readOnly: true
                    type: string
                referrer:
                    description:
                        "Referring URL the visitor arrived from, when known."
                    readOnly: true
                    type: string
                url:
                    description:
                        "Actual URL of the page where the event was emitted (may differ from canonicalUrl)."
                    readOnly: true
                    type: string
            type: object
        PageMetric:
            description:
                "Analytics metrics for a single tracked page over the selected date range. Aggregates view, visitor,
                bounce, and access-path metrics flattened from the metric tree. Use `getSitePagesPage` to list these for
                a site."
            properties:
                assetId:
                    description:
                        "Identifier of the page. The canonical URL of the page."
                    readOnly: true
                    type: string
                assetTitle:
                    description:
                        "Display title of the page."
                    readOnly: true
                    type: string
                assetType:
                    description:
                        "Always 'PAGE' for results from this endpoint."
                    readOnly: true
                    type: string
                avgTimeOnPage:
                    description:
                        "Average time-on-page in seconds across all sessions in the date range."
                    format: double
                    readOnly: true
                    type: number
                bounceRate:
                    description:
                        "Fraction (0–1) of sessions that landed on this page and exited without further interaction."
                    format: double
                    readOnly: true
                    type: number
                dataSourceId:
                    description:
                        "Identifier of the data source providing this page's analytics events."
                    readOnly: true
                    type: string
                directAccess:
                    description:
                        "Visit count where this page was the entry point with no referrer (direct URL)."
                    format: double
                    readOnly: true
                    type: number
                entrances:
                    description:
                        "Total entrance count: sessions that started on this page (regardless of access type)."
                    format: double
                    readOnly: true
                    type: number
                exitRate:
                    description:
                        "Fraction (0–1) of sessions on which this page was the last page viewed before exit."
                    format: double
                    readOnly: true
                    type: number
                indirectAccess:
                    description:
                        "Visit count where this page was reached via a referrer (search engine, link, etc.)."
                    format: double
                    readOnly: true
                    type: number
                urls:
                    description:
                        "All distinct URLs that resolve to this page (canonical plus alternates), within the selected
                        date range."
                    items:
                        type: string
                    readOnly: true
                    type: array
                views:
                    description:
                        "Total page-view count over the selected date range."
                    format: double
                    readOnly: true
                    type: number
                viewsTrendPercentage:
                    description:
                        "Percentage change in views vs. the previous comparable period."
                    format: double
                    readOnly: true
                    type: number
                visitors:
                    description:
                        "Distinct visitor count (deduplicated by individual or session) over the date range."
                    format: double
                    readOnly: true
                    type: number
                visitorsTrendPercentage:
                    description:
                        "Percentage change in distinct visitors vs. the previous comparable period."
                    format: double
                    readOnly: true
                    type: number
            type: object
info:
    description:
        "Read-only headless REST API for Liferay Analytics Cloud. Exposes events, pages, and asset-summary metrics for
        use as MCP tools and external integrations. All endpoints are scoped to a provisioned Analytics Cloud
        workspace.. A Java client JAR is available for use with the group ID 'com.liferay', artifact ID
        'com.liferay.osb.faro.rest.client', and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Faro Headless REST API
    version: v1.0
    x-class-name: FaroRest
openapi: 3.0.1
paths:
    "/sites/{siteId}/asset-summaries":
        get:
            description:
                "List analytics asset summaries (page, blog, document, form, journal, object-entry) ranked by the
                requested sort metric, returning download/impression/read/view counts plus their period-over-period
                trend percentages, optionally narrowed to a single channel (also know as property) or to a date range.
                Use this to answer 'what content is performing best' and to pick assets for deeper drill-down via
                `getSitePagesPage`."
            operationId: getSiteAssetSummariesPage
            parameters:
                -   in: path
                    description:
                        "Identifier of the Liferay site that owns the Analytics Cloud workspace."
                    name: siteId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    description:
                        "Optional Channel property id to scope results to a single channel."
                    name: channelId
                    schema:
                        type: string
                -   in: query
                    description:
                        "1-based page number."
                    name: page
                    schema:
                        type: integer
                -   in: query
                    description:
                        "Page size."
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    description:
                        "Custom range end as ISO datetime. Pair with rangeStart."
                    name: rangeEnd
                    schema:
                        type: string
                -   in: query
                    description:
                        "Date-range preset code (0 = LAST_24_HOURS, 1 = YESTERDAY, 7 = LAST_7_DAYS, 28 = LAST_28_DAYS,
                        30 = LAST_30_DAYS, 90 = LAST_90_DAYS, 180 = LAST_180_DAYS, 365 = LAST_YEAR). Otherwise, provide
                        the rangeStart/rangeEnd. Mutually exclusive with rangeStart/rangeEnd; if provided, those are
                        ignored."
                    name: rangeKey
                    schema:
                        format: int32
                        type: integer
                -   in: query
                    description:
                        "Custom range start as ISO datetime (e.g. 2026-01-01T00:00:00Z). Use with rangeEnd as a rangeKey
                        alternative."
                    name: rangeStart
                    schema:
                        type: string
                -   in: query
                    description:
                        "Free-text keyword search across asset titles. Empty/null returns all matching assets."
                    name: search
                    schema:
                        type: string
                -   in: query
                    description:
                        "Sort expression `column:asc|desc`. Defaults to `views:desc` when omitted. Common columns:
                        views, downloads, impressions, reads."
                    example: views:desc
                    name: sort
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AssetSummaryMetric"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/AssetSummaryMetric"
                                type: array
            tags: ["AssetSummaryMetric"]
    "/sites/{siteId}/channels/{channelId}/events":
        get:
            description:
                "List tracked analytics events (page views, custom events, form submissions, etc.) for a specific
                channel (also known as property), optionally narrowed to a date range. Use this to inspect raw activity
                for a channel; for aggregated metrics across events, prefer `getSiteAssetSummariesPage` or
                `getSitePagesPage`."
            operationId: getSiteChannelEventsPage
            parameters:
                -   in: path
                    description:
                        "Identifier of the Liferay site that owns the Analytics Cloud workspace."
                    name: siteId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: path
                    description:
                        "Identifier of the Channel whose events should be listed."
                    name: channelId
                    required: true
                    schema:
                        type: string
                -   in: query
                    description:
                        "If true, include events from anonymous individuals."
                    name: includeAnonymousUsers
                    schema:
                        type: boolean
                -   in: query
                    description:
                        "1-based page number."
                    name: page
                    schema:
                        type: integer
                -   in: query
                    description:
                        "Page size."
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    description:
                        "Custom range end as ISO datetime. Pair with rangeStart."
                    name: rangeEnd
                    schema:
                        type: string
                -   in: query
                    description:
                        "Date-range preset code (0 = LAST_24_HOURS, 1 = YESTERDAY, 7 = LAST_7_DAYS, 28 = LAST_28_DAYS,
                        30 = LAST_30_DAYS, 90 = LAST_90_DAYS, 180 = LAST_180_DAYS, 365 = LAST_YEAR). Otherwise, provide
                        the rangeStart/rangeEnd. Mutually exclusive with rangeStart/rangeEnd; if provided, those are
                        ignored."
                    name: rangeKey
                    schema:
                        format: int32
                        type: integer
                -   in: query
                    description:
                        "Custom range start as ISO datetime (e.g. 2026-01-01T00:00:00Z). Use with rangeEnd as a rangeKey
                        alternative."
                    name: rangeStart
                    schema:
                        type: string
                -   in: query
                    description:
                        "Free-text keyword search across asset titles. Empty/null returns all matching assets."
                    name: search
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Event"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/Event"
                                type: array
            tags: ["Event"]
    "/sites/{siteId}/pages":
        get:
            description:
                "List analytics metrics for tracked pages on the site, ranked by views or another metric, optionally
                narrowed to a single channel (also known as property) or data source. Use this for 'top pages' style
                queries. Returns flattened view, visitor, bounce, exit, and access-path metrics for each page; for
                cross-asset comparisons that include non-pages, use `getSiteAssetSummariesPage`."
            operationId: getSitePagesPage
            parameters:
                -   in: path
                    description:
                        "Identifier of the Liferay site that owns the Analytics Cloud workspace."
                    name: siteId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    description:
                        "Optional channel ID to scope results to a single channel."
                    name: channelId
                    schema:
                        type: string
                -   in: query
                    description:
                        "Optional data source ID to scope results to a single data source."
                    name: dataSourceId
                    schema:
                        type: string
                -   in: query
                    description:
                        "1-based page number."
                    name: page
                    schema:
                        type: integer
                -   in: query
                    description:
                        "Page size."
                    name: pageSize
                    schema:
                        type: integer
                -   in: query
                    description:
                        "Custom range end as ISO datetime. Pair with rangeStart."
                    name: rangeEnd
                    schema:
                        type: string
                -   in: query
                    description:
                        "Date-range preset code (0 = LAST_24_HOURS, 1 = YESTERDAY, 7 = LAST_7_DAYS, 28 = LAST_28_DAYS,
                        30 = LAST_30_DAYS, 90 = LAST_90_DAYS, 180 = LAST_180_DAYS, 365 = LAST_YEAR). Otherwise, provide
                        the rangeStart/rangeEnd. Mutually exclusive with rangeStart/rangeEnd; if provided, those are
                        ignored."
                    name: rangeKey
                    schema:
                        format: int32
                        type: integer
                -   in: query
                    description:
                        "Custom range start as ISO datetime (e.g. 2026-01-01T00:00:00Z). Use with rangeEnd as a rangeKey
                        alternative."
                    name: rangeStart
                    schema:
                        type: string
                -   in: query
                    description:
                        "Free-text keyword search across page titles and URLs."
                    name: search
                    schema:
                        type: string
                -   in: query
                    description:
                        "Sort expression `column:asc|desc`. Defaults to `views:desc`. Common columns: views, visitors,
                        bounceRate, avgTimeOnPage."
                    example: views:desc
                    name: sort
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/PageMetric"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/PageMetric"
                                type: array
            tags: ["PageMetric"]