name: Daily Docker Build

on:
  schedule:
    - cron: '0 0 * * *'  
  push:
    branches: [ "main" ] 
  workflow_dispatch:      

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'ant'

      # 1. Create the build.me.properties file in the ROOT
      - name: Create Build Properties File
        run: |
          echo "build.repository.private.password=${{ secrets.NEXUS_PASSWORD }}" > build.me.properties
          echo "build.repository.private.url=${{ secrets.NEXUS_URL }}" >> build.me.properties
          echo "build.repository.private.username=${{ secrets.NEXUS_USERNAME }}" >> build.me.properties

      # 2. Run Ant commands from the ROOT
      - name: Run Ant Preparation and Build
        run: |
          ant setup-profile-dxp
          ant all

      # 3. Navigate to osb-faro module and run Gradle Task
      - name: Build Module Docker Image
        working-directory: ./modules/dxp/apps/osb/osb-faro
        run: |
          chmod +x ../../../../../gradlew
          ../../../../../gradlew buildAppDockerImage

      # 4. Log in and Push
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker tag osb-faro:latest liferay/com-liferay-osb-faro:master
          docker push liferay/osb-faro:master
